# main branch -> commit sample.diff
name: Update and commit sample.diff

on:
  push:
    branches: [ main ]

jobs:
  update-samplediff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 17
      - name: Remove Unused Resouces
        run: |
          ./gradlew :sample:lintDebug -Prur.lint.onlyUnusedResources -Prur.lint.overrideLintConfig="lint.empty.xml"
          ./gradlew :sample:removeUnusedResourcesDebug
      - uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: gpg
        with:
          gpg_private_key: ${{ secrets.SIGNING_PGP_KEY }}
          passphrase: ${{ secrets.SIGNING_PGP_PASSWORD }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true
      - name: commit sample.diff
        env:
          GIT_AUTHOR_NAME: irgaly
          GIT_AUTHOR_EMAIL: ${{ steps.gpg.outputs.email }}
          GIT_COMMITTER_NAME: irgaly
          GIT_COMMITTER_EMAIL: ${{ steps.gpg.outputs.email }}
        run: |
          git diff --unified=0 ":!sample.diff" | sed "/^index .*$/d"> sample.diff
          git add sample.diff && git commit -m "Update sample.diff" && git push origin HEAD || echo "No Changes"
